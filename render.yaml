services:
  - type: web
    name: janaseva-kerala-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: janaseva-kerala-db
          property: connectionString

databases:
  - name: janaseva-kerala-db
    databaseName: janaseva_db
    user: janaseva_user
    plan: free
